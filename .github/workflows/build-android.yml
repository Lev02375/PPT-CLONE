name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  GODOT_VERSION: 4.2.2
  EXPORT_NAME: PoppyPlaytimeClone

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip default-jdk

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot
          sudo mv godot /usr/local/bin/

      - name: Download and install Godot Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Generate Debug Keystore (JKS format)
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore $GITHUB_WORKSPACE/
          ls -la $GITHUB_WORKSPACE/debug.keystore

      - name: Create .godot folder
        run: mkdir -p .godot

      - name: Create export directory
        run: mkdir -v -p build/android

      - name: Build Android APK (Debug)
        run: |
          godot --headless --verbose --export-debug "Android" build/android/${EXPORT_NAME}.apk
        timeout-minutes: 15

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/${EXPORT_NAME}.apk
